# Pingap Configuration - SSL Proxy for AlternateFutures
# Built on Cloudflare's Pingora framework
#
# Uses Cloudflare Origin Certificate (static) instead of ACME DNS-01
# This avoids DNS propagation timing issues with Let's Encrypt
#
# IMPORTANT: Upstream addrs must be the raw Akash provider ingress URLs,
# NOT the custom domain names (which resolve back to this proxy's IP).

[basic]
name = "alternatefutures-proxy"
threads = 2
work_stealing = true
grace_period = "10s"
pid_file = "/tmp/pingap.pid"

# Cloudflare Origin Certificate - files written by entrypoint.sh from env vars
[certificates.alternatefutures]
tls_cert = "/etc/pingap/certs/origin.crt"
tls_key = "/etc/pingap/certs/origin.key"
is_default = true

# Auth Service Backend (DSEQ 25455624 on tagus.host)
[upstreams.auth]
addrs = ["5v8olt8tct9ftf04tahnmbbv50.ingress.akash.tagus.host:80"]
connection_timeout = "10s"
health_check_connection_timeout = "10s"

# API Service Backend (DSEQ 25455635 on cap-test-compute.com)
[upstreams.api]
addrs = ["dih6jcs8fhedhboe9302j8ste8.ingress.cap-test-compute.com:80"]
connection_timeout = "10s"
health_check_connection_timeout = "10s"

# Data Services Backend (DSEQ 25423172 on boogle — IPFS + Jaeger)
# TODO: Update with actual boogle ingress URLs once retrieved
#[upstreams.ipfs]
#addrs = ["<ipfs-ingress>.ingress.boogle.provider:80"]
#connection_timeout = "30s"
#health_check_connection_timeout = "10s"

# Route: Auth Service
[locations.auth]
upstream = "auth"
host = "auth.alternatefutures.ai"
path = "/"
proxy_set_headers = ["Host: 5v8olt8tct9ftf04tahnmbbv50.ingress.akash.tagus.host", "X-Forwarded-Proto: https", "X-Forwarded-Host: auth.alternatefutures.ai", "X-Real-IP: $remote_addr"]

# Route: API Service
[locations.api]
upstream = "api"
host = "api.alternatefutures.ai"
path = "/"
proxy_set_headers = ["Host: dih6jcs8fhedhboe9302j8ste8.ingress.cap-test-compute.com", "X-Forwarded-Proto: https", "X-Forwarded-Host: api.alternatefutures.ai", "X-Real-IP: $remote_addr"]

# Health check route
[locations.health]
path = "/health"
plugins = ["pingap:responseHeaders?X-Health-Check:ok", "pingap:mock?status=200&text=OK"]

# HTTP Server (for Akash ingress - Cloudflare handles TLS at edge)
[servers.http]
addr = "0.0.0.0:80"
locations = ["auth", "api", "health"]

# HTTPS Server - uses global certificates from [certificates.alternatefutures]
[servers.https]
addr = "0.0.0.0:443"
locations = ["auth", "api"]
global_certificates = true
tls_cipher_list = "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
tls_min_version = "1.2"
enabled_h2 = true

# Health check HTTP Server (for Akash health probes)
[servers.health]
addr = "0.0.0.0:8080"
locations = ["health"]
